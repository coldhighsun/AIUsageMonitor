name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AIUsageMonitor.slnx

      - name: Build
        run: dotnet build AIUsageMonitor.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/AIUsageMonitor.Core.Tests/AIUsageMonitor.Core.Tests.csproj --no-restore --configuration Release

  release:
    name: Release (${{ matrix.rid }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained
        run: >
          dotnet publish src/AIUsageMonitor.Cli -c Release -r ${{ matrix.rid }}
          --self-contained true -o publish/${{ matrix.rid }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath aimon-cli-${{ github.ref_name }}-${{ matrix.rid }}.zip

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          tar -czf aimon-cli-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: aimon-cli-${{ github.ref_name }}-${{ matrix.rid }}.*
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-nuget:
    name: Publish dotnet tool to NuGet
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/AIUsageMonitor.Cli -c Release -o nupkg

      - name: Push to NuGet
        run: >
          dotnet nuget push nupkg/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate
