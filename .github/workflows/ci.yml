name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AIUsageMonitor.slnx

      - name: Build
        run: dotnet build AIUsageMonitor.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/AIUsageMonitor.Core.Tests/AIUsageMonitor.Core.Tests.csproj --no-build --configuration Release

  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish src/AIUsageMonitor.Cli/AIUsageMonitor.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output ./publish/${{ matrix.rid }}

      - name: Zip artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Only the executable ships; drop any debug symbols that publish may emit.
          rm -f ./publish/${{ matrix.rid }}/*.pdb
          ZIP_NAME=aimon-cli-${VERSION}-${{ matrix.rid }}.zip
          zip -j ./${ZIP_NAME} ./publish/${{ matrix.rid }}/aimon*
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimon-cli-${{ matrix.rid }}
          path: ./${{ env.ZIP_NAME }}

  pack:
    name: Pack & Publish NuGet Tool
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/AIUsageMonitor.Cli/AIUsageMonitor.Cli.csproj

      - name: Pack
        run: dotnet pack src/AIUsageMonitor.Cli/AIUsageMonitor.Cli.csproj --no-restore --configuration Release --output ./artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [pack, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: aimon-cli-*
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AIUsageMonitor ${{ github.ref_name }}
          files: ./artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
